name: fl_contacts
description: Flutter plugin to read, create, update, delete and observe native contacts on Android and iOS, with group support, vCard support, and contact permission handling
version: 1.3.1
homepage: https://github.com/QuisApp/fl_contacts
repository: https://github.com/QuisApp/fl_contacts

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - contacts
  - address-book
  - vcard
  - permissions

flutter:
  plugin:
    platforms:
      android:
        package: co.quis.fl_contacts
        pluginClass: FlContactsPlugin
      ios:
        pluginClass: FlContactsPlugin
      macos:
        pluginClass: FlContactsPlugin
      windows:
        pluginClass: FlContactsPlugin
      linux:
        pluginClass: FlContactsPlugin
