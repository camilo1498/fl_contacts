name: fl_contacts_example
description: Minimal example app for the fl_contacts plugin.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  fl_contacts:
    path: ../
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  go_router_builder: ^4.5.0

flutter:
  uses-material-design: true
